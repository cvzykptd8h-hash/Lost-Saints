<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost Saints — Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #111;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 35px;
    }

    .login-box h1 {
      margin: 0 0 8px;
      font-size: 30px;
      letter-spacing: -1px;
    }

    .login-box p {
      color: #666;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #ccc;
      background: #fff;
      padding: 12px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #111;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .btn {
      border: 1px solid #111;
      background: #111;
      color: #fff;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn:hover {
      opacity: .85;
    }

    .btn-light {
      background: #fff;
      color: #111;
    }

    .btn-green {
      background: #176b3a;
      border-color: #176b3a;
    }

    .btn-red {
      background: #9d2020;
      border-color: #9d2020;
    }

    .btn-small {
      padding: 9px 12px;
      font-size: 13px;
    }

    .admin {
      min-height: 100vh;
    }

    header {
      background: #111;
      color: #fff;
      padding: 18px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -.5px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .header-actions .btn-light {
      background: #fff;
      color: #111;
    }

    main {
      max-width: 1300px;
      margin: 0 auto;
      padding: 25px;
    }

    .toolbar {
      background: #fff;
      padding: 18px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
    }

    .toolbar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .toolbar h2 {
      margin: 0;
      font-size: 18px;
    }

    .toolbar-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status {
      margin-top: 12px;
      padding: 10px 12px;
      background: #f3f3f3;
      color: #555;
      font-size: 13px;
    }

    .products-list {
      display: grid;
      gap: 12px;
      margin-bottom: 25px;
    }

    .product-row {
      background: #fff;
      border: 1px solid #ddd;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .product-info {
      min-width: 0;
    }

    .product-name {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .product-meta {
      font-size: 12px;
      color: #777;
    }

    .product-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge {
      display: inline-block;
      padding: 4px 7px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      margin-left: 5px;
    }

    .badge-draft {
      background: #eee;
      color: #555;
    }

    .badge-published {
      background: #dff3e6;
      color: #176b3a;
    }

    .badge-soldout {
      background: #f8dddd;
      color: #9d2020;
    }

    .editor {
      background: #fff;
      border: 1px solid #ddd;
      padding: 22px;
    }

    .editor h2 {
      margin: 0 0 20px;
      font-size: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
    }

    .checkbox-row input {
      width: auto;
      margin: 0;
    }

    .checkbox-row label {
      margin: 0;
      font-weight: 700;
    }

    .images {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .image-upload {
      border: 1px solid #ddd;
      padding: 14px;
    }

    .image-upload h3 {
      margin: 0 0 10px;
      font-size: 13px;
      text-transform: uppercase;
    }

    .image-preview {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #f2f2f2;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .image-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .stock-section {
      border-top: 1px solid #ddd;
      margin-top: 20px;
      padding-top: 20px;
    }

    .stock-section h3 {
      margin: 0 0 15px;
      font-size: 15px;
    }

    .sizes {
      display: grid;
      grid-template-columns: repeat(7, minmax(70px, 1fr));
      gap: 8px;
    }

    .size-box {
      border: 1px solid #ddd;
      padding: 9px;
    }

    .size-box label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: center;
    }

    .size-box input {
      text-align: center;
      padding: 9px 4px;
    }

    .editor-actions {
      display: flex;
      gap: 8px;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    .empty {
      background: #fff;
      border: 1px solid #ddd;
      padding: 30px;
      text-align: center;
      color: #777;
    }

    .error {
      color: #a00000;
      font-size: 13px;
      margin-top: 10px;
    }

    .success {
      color: #176b3a;
      font-size: 13px;
      margin-top: 10px;
    }

    @media (max-width: 800px) {
      .grid,
      .images {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .sizes {
        grid-template-columns: repeat(4, 1fr);
      }

      .product-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .product-actions {
        justify-content: flex-start;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 480px) {
      main {
        padding: 12px;
      }

      .login-box {
        padding: 25px;
      }

      .sizes {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginPage" class="login-page">
    <div class="login-box">
      <h1>Lost Saints</h1>
      <p>Admin Panel</p>

      <form id="loginForm">
        <div class="field">
          <label>Email</label>
          <input id="loginEmail" type="email" required>
        </div>

        <div class="field">
          <label>Password</label>
          <input id="loginPassword" type="password" required>
        </div>

        <button class="btn" type="submit">Login</button>

        <div id="loginError" class="error"></div>
      </form>
    </div>
  </div>

  <!-- ADMIN -->
  <div id="adminPage" class="admin hidden">

    <header>
      <h1>LOST SAINTS — ADMIN</h1>

      <div class="header-actions">
        <button id="newProductBtn" class="btn btn-light btn-small">
          + New Product
        </button>

        <button id="logoutBtn" class="btn btn-light btn-small">
          Logout
        </button>
      </div>
    </header>

    <main>

      <!-- PUBLISH CONTROLS -->
      <section class="toolbar">

        <div class="toolbar-top">
          <div>
            <h2>Store Publishing</h2>
          </div>

          <div class="toolbar-buttons">
            <button id="publishAllBtn" class="btn btn-green">
              Publish All
            </button>

            <button id="unpublishAllBtn" class="btn btn-red">
              Unpublish All
            </button>
          </div>
        </div>

        <div id="publishStatus" class="status">
          Edit products as drafts. When the whole drop is ready, press Publish All.
        </div>

      </section>

      <!-- PRODUCTS -->
      <section>
        <div id="productsList" class="products-list"></div>
      </section>

      <!-- EDITOR -->
      <section id="editor" class="editor hidden">

        <h2 id="editorTitle">New Product</h2>

        <form id="productForm">

          <div class="grid">

            <div class="field">
              <label>Product Name</label>
              <input id="productName" type="text" required>
            </div>

            <div class="field">
              <label>Price (€)</label>
              <input id="productPrice" type="number" step="0.01" min="0" required>
            </div>

            <div class="field">
              <label>Category</label>
              <select id="productCategory">
                <option value="tops">Tops</option>
                <option value="bottoms">Bottoms</option>
                <option value="accessories">Accessories</option>
                <option value="outerwear">Outerwear</option>
                <option value="other">Other</option>
              </select>
            </div>

            <div class="field">
              <label>Drop</label>
              <input id="productDrop" type="text" value="Available now">
            </div>

            <div class="field full">
              <label>Description</label>
              <textarea id="productDescription"></textarea>
            </div>

            <div class="field full">
              <div class="checkbox-row">
                <input id="productAvailable" type="checkbox" checked>
                <label for="productAvailable">Product Available</label>
              </div>

              <div class="checkbox-row">
                <input id="productPublished" type="checkbox">
                <label for="productPublished">Publish Product on Store</label>
              </div>
            </div>

            <!-- IMAGES -->
            <div class="field full">
              <label>Product Images</label>

              <div class="images">

                <div class="image-upload">
                  <h3>Front</h3>

                  <div id="frontPreview" class="image-preview">
                    No image
                  </div>

                  <input id="frontFile" type="file" accept="image/*">
                </div>

                <div class="image-upload">
                  <h3>Back</h3>

                  <div id="backPreview" class="image-preview">
                    No image
                  </div>

                  <input id="backFile" type="file" accept="image/*">
                </div>

              </div>
            </div>

          </div>

          <!-- STOCK -->
          <div class="stock-section">

            <h3>Stock Per Size</h3>

            <div class="sizes">

              <div class="size-box">
                <label>XXS</label>
                <input id="stockXXS" type="number" min="0" value="0">
              </div>

              <div class="size-box">
                <label>XS</label>
                <input id="stockXS" type="number" min="0" value="0">
              </div>

              <div class="size-box">
                <label>S</label>
                <input id="stockS" type="number" min="0" value="0">
              </div>

              <div class="size-box">
                <label>M</label>
                <input id="stockM" type="number" min="0" value="0">
              </div>

              <div class="size-box">
                <label>L</label>
                <input id="stockL" type="number" min="0" value="0">
              </div>

              <div class="size-box">
                <label>XL</label>
                <input id="stockXL" type="number" min="0" value="0">
              </div>

              <div class="size-box">
                <label>XXL</label>
                <input id="stockXXL" type="number" min="0" value="0">
              </div>

            </div>

          </div>

          <div class="editor-actions">

            <button type="submit" class="btn">
              Save Product
            </button>

            <button id="saveDraftBtn" type="button" class="btn btn-light">
              Save as Draft
            </button>

            <button id="cancelBtn" type="button" class="btn btn-light">
              Cancel
            </button>

          </div>

          <div id="editorMessage"></div>

        </form>

      </section>

    </main>
  </div>

  <script>
    const SUPABASE_URL = "https://lvppsjgohaefczbmzdlm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_f9W3McCrxK98_AeydqIFiQ_L1WHR7UV";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    let products = [];
    let editingProductId = null;
    let frontImageUrl = "";
    let backImageUrl = "";

    const sizes = [
      "XXS",
      "XS",
      "S",
      "M",
      "L",
      "XL",
      "XXL"
    ];

    const loginPage = document.getElementById("loginPage");
    const adminPage = document.getElementById("adminPage");
    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");

    const productsList = document.getElementById("productsList");
    const editor = document.getElementById("editor");
    const editorTitle = document.getElementById("editorTitle");
    const productForm = document.getElementById("productForm");
    const editorMessage = document.getElementById("editorMessage");

    const productName = document.getElementById("productName");
    const productPrice = document.getElementById("productPrice");
    const productCategory = document.getElementById("productCategory");
    const productDrop = document.getElementById("productDrop");
    const productDescription = document.getElementById("productDescription");
    const productAvailable = document.getElementById("productAvailable");
    const productPublished = document.getElementById("productPublished");

    const frontFile = document.getElementById("frontFile");
    const backFile = document.getElementById("backFile");

    const frontPreview = document.getElementById("frontPreview");
    const backPreview = document.getElementById("backPreview");

    const publishStatus = document.getElementById("publishStatus");


    function showLogin() {
      loginPage.classList.remove("hidden");
      adminPage.classList.add("hidden");
    }


    function showAdmin() {
      loginPage.classList.add("hidden");
      adminPage.classList.remove("hidden");
    }


    function showMessage(message, type = "success") {
      editorMessage.className = type;
      editorMessage.textContent = message;
    }


    function clearMessage() {
      editorMessage.textContent = "";
      editorMessage.className = "";
    }


    function getStockFromForm() {
      return {
        XXS: Number(document.getElementById("stockXXS").value) || 0,
        XS: Number(document.getElementById("stockXS").value) || 0,
        S: Number(document.getElementById("stockS").value) || 0,
        M: Number(document.getElementById("stockM").value) || 0,
        L: Number(document.getElementById("stockL").value) || 0,
        XL: Number(document.getElementById("stockXL").value) || 0,
        XXL: Number(document.getElementById("stockXXL").value) || 0
      };
    }


    function setStockInForm(stock = {}) {
      document.getElementById("stockXXS").value = Number(stock.XXS || 0);
      document.getElementById("stockXS").value = Number(stock.XS || 0);
      document.getElementById("stockS").value = Number(stock.S || 0);
      document.getElementById("stockM").value = Number(stock.M || 0);
      document.getElementById("stockL").value = Number(stock.L || 0);
      document.getElementById("stockXL").value = Number(stock.XL || 0);
      document.getElementById("stockXXL").value = Number(stock.XXL || 0);
    }


    function safeJson(value, fallback) {
      if (value === null || value === undefined) {
        return fallback;
      }

      if (typeof value === "object") {
        return value;
      }

      try {
        return JSON.parse(value);
      } catch {
        return fallback;
      }
    }


    async function checkAdmin() {
      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (!session) {
        showLogin();
        return false;
      }

      const { data, error } = await supabaseClient
        .from("admin_users")
        .select("user_id")
        .eq("user_id", session.user.id)
        .maybeSingle();

      if (error || !data) {
        await supabaseClient.auth.signOut();
        showLogin();
        loginError.textContent = "You are not authorized to access the admin panel.";
        return false;
      }

      showAdmin();
      return true;
    }


    async function loadProducts() {
      productsList.innerHTML = `
        <div class="empty">
          Loading products...
        </div>
      `;

      const { data, error } = await supabaseClient
        .from("products")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        productsList.innerHTML = `
          <div class="empty">
            Error loading products: ${escapeHtml(error.message)}
          </div>
        `;
        return;
      }

      products = (data || []).map(product => ({
        ...product,
        price: Number(product.price || 0),
        sizes: safeJson(product.sizes, []),
        stock: safeJson(product.stock, {})
      }));

      renderProducts();
      updatePublishStatus();
    }


    function renderProducts() {
      if (!products.length) {
        productsList.innerHTML = `
          <div class="empty">
            No products yet. Click "+ New Product".
          </div>
        `;
        return;
      }

      productsList.innerHTML = products.map(product => {

        const publishedBadge = product.published
          ? `<span class="badge badge-published">Published</span>`
          : `<span class="badge badge-draft">Draft</span>`;

        const availableBadge = !product.available
          ? `<span class="badge badge-soldout">Sold Out</span>`
          : "";

        return `
          <div class="product-row">

            <div class="product-info">

              <div class="product-name">
                ${escapeHtml(product.name)}
                ${publishedBadge}
                ${availableBadge}
              </div>

              <div class="product-meta">
                €${Number(product.price).toFixed(2)}
                · ${escapeHtml(product.category || "")}
                · ${escapeHtml(product.drop || "")}
              </div>

            </div>

            <div class="product-actions">

              <button
                class="btn btn-light btn-small"
                onclick="editProduct(${product.id})"
              >
                Edit
              </button>

              ${
                product.published
                ? `
                  <button
                    class="btn btn-red btn-small"
                    onclick="unpublishProduct(${product.id})"
                  >
                    Unpublish
                  </button>
                `
                : `
                  <button
                    class="btn btn-green btn-small"
                    onclick="publishProduct(${product.id})"
                  >
                    Publish
                  </button>
                `
              }

              <button
                class="btn btn-red btn-small"
                onclick="deleteProduct(${product.id})"
              >
                Delete
              </button>

            </div>

          </div>
        `;
      }).join("");
    }


    function updatePublishStatus() {
      const total = products.length;
      const published = products.filter(p => p.published).length;
      const drafts = total - published;

      publishStatus.textContent =
        `${published} published · ${drafts} draft${drafts === 1 ? "" : "s"} · ${total} total`;
    }


    function resetEditor() {
      editingProductId = null;
      frontImageUrl = "";
      backImageUrl = "";

      editorTitle.textContent = "New Product";

      productForm.reset();

      productAvailable.checked = true;
      productPublished.checked = false;

      productDrop.value = "Available now";

      setStockInForm({});

      frontPreview.innerHTML = "No image";
      backPreview.innerHTML = "No image";

      frontFile.value = "";
      backFile.value = "";

      clearMessage();
    }


    function openNewProduct() {
      resetEditor();
      editor.classList.remove("hidden");

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });
    }


    window.editProduct = function(id) {
      const product = products.find(p => Number(p.id) === Number(id));

      if (!product) {
        return;
      }

      editingProductId = product.id;

      editorTitle.textContent = "Edit Product";

      productName.value = product.name || "";
      productPrice.value = product.price || 0;
      productCategory.value = product.category || "tops";
      productDrop.value = product.drop || "Available now";
      productDescription.value = product.description || "";

      productAvailable.checked = product.available !== false;
      productPublished.checked = product.published === true;

      frontImageUrl = product.front || "";
      backImageUrl = product.back || "";

      setStockInForm(product.stock || {});

      if (frontImageUrl) {
        frontPreview.innerHTML = `<img src="${escapeAttribute(frontImageUrl)}" alt="Front">`;
      } else {
        frontPreview.innerHTML = "No image";
      }

      if (backImageUrl) {
        backPreview.innerHTML = `<img src="${escapeAttribute(backImageUrl)}" alt="Back">`;
      } else {
        backPreview.innerHTML = "No image";
      }

      frontFile.value = "";
      backFile.value = "";

      clearMessage();

      editor.classList.remove("hidden");

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });
    };


    async function uploadImage(file, side) {
      if (!file) {
        return side === "front" ? frontImageUrl : backImageUrl;
      }

      const extension = file.name.split(".").pop().toLowerCase();

      const safeName = (productName.value || "product")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");

      const uniqueName =
        `${safeName || "product"}-${side}-${Date.now()}.${extension}`;

      const path = uniqueName;

      const { error } = await supabaseClient
        .storage
        .from("product-images")
        .upload(path, file, {
          cacheControl: "3600",
          upsert: true
        });

      if (error) {
        throw error;
      }

      const {
        data
      } = supabaseClient
        .storage
        .from("product-images")
        .getPublicUrl(path);

      return data.publicUrl;
    }


    async function saveProduct(forceDraft = false) {

      clearMessage();

      try {

        const name = productName.value.trim();
        const price = Number(productPrice.value);

        if (!name) {
          showMessage("Product name is required.", "error");
          return;
        }

        if (!Number.isFinite(price) || price < 0) {
          showMessage("Please enter a valid price.", "error");
          return;
        }

        showMessage("Saving...", "success");

        if (frontFile.files[0]) {
          frontImageUrl = await uploadImage(
            frontFile.files[0],
            "front"
          );
        }

        if (backFile.files[0]) {
          backImageUrl = await uploadImage(
            backFile.files[0],
            "back"
          );
        }

        const stock = getStockFromForm();

        const sizesForProduct = sizes.filter(
          size => Number(stock[size] || 0) > 0
        );

        const payload = {
          name,
          price,
          category: productCategory.value,
          front: frontImageUrl || null,
          back: backImageUrl || null,
          drop: productDrop.value.trim() || "Available now",
          description: productDescription.value.trim(),
          available: productAvailable.checked,
          published: forceDraft ? false : productPublished.checked,
          sizes: sizesForProduct,
          stock
        };

        let result;

        if (editingProductId) {

          result = await supabaseClient
            .from("products")
            .update(payload)
            .eq("id", editingProductId);

        } else {

          result = await supabaseClient
            .from("products")
            .insert(payload);

        }

        if (result.error) {
          throw result.error;
        }

        showMessage(
          forceDraft
            ? "Saved as Draft."
            : payload.published
              ? "Product saved and published."
              : "Product saved as Draft.",
          "success"
        );

        await loadProducts();

        setTimeout(() => {
          editor.classList.add("hidden");
        }, 500);

      } catch (error) {

        console.error(error);

        showMessage(
          error.message || "Something went wrong.",
          "error"
        );
      }
    }


    window.publishProduct = async function(id) {

      const { error } = await supabaseClient
        .from("products")
        .update({
          published: true
        })
        .eq("id", id);

      if (error) {
        alert(error.message);
        return;
      }

      await loadProducts();
    };


    window.unpublishProduct = async function(id) {

      const { error } = await supabaseClient
        .from("products")
        .update({
          published: false
        })
        .eq("id", id);

      if (error) {
        alert(error.message);
        return;
      }

      await loadProducts();
    };


    window.deleteProduct = async function(id) {

      const product = products.find(
        p => Number(p.id) === Number(id)
      );

      if (!product) {
        return;
      }

      const confirmed = confirm(
        `Delete "${product.name}"? This cannot be undone.`
      );

      if (!confirmed) {
        return;
      }

      const { error } = await supabaseClient
        .from("products")
        .delete()
        .eq("id", id);

      if (error) {
        alert(error.message);
        return;
      }

      if (editingProductId === id) {
        editor.classList.add("hidden");
      }

      await loadProducts();
    };


    async function publishAll() {

      if (!products.length) {
        return;
      }

      const drafts = products.filter(
        product => !product.published
      );

      if (!drafts.length) {
        alert("Everything is already published.");
        return;
      }

      const confirmed = confirm(
        `Publish all ${drafts.length} draft products to the store?`
      );

      if (!confirmed) {
        return;
      }

      publishStatus.textContent = "Publishing all products...";

      const { error } = await supabaseClient
        .from("products")
        .update({
          published: true
        })
        .eq("published", false);

      if (error) {
        alert(error.message);
        await loadProducts();
        return;
      }

      await loadProducts();

      publishStatus.textContent =
        "All products are now published.";
    }


    async function unpublishAll() {

      if (!products.length) {
        return;
      }

      const publishedProducts = products.filter(
        product => product.published
      );

      if (!publishedProducts.length) {
        alert("Everything is already unpublished.");
        return;
      }

      const confirmed = confirm(
        `Unpublish all ${publishedProducts.length} products from the store?`
      );

      if (!confirmed) {
        return;
      }

      publishStatus.textContent = "Unpublishing all products...";

      const { error } = await supabaseClient
        .from("products")
        .update({
          published: false
        })
        .eq("published", true);

      if (error) {
        alert(error.message);
        await loadProducts();
        return;
      }

      await loadProducts();

      publishStatus.textContent =
        "All products are now Draft.";
    }


    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function escapeAttribute(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }


    loginForm.addEventListener("submit", async event => {

      event.preventDefault();

      loginError.textContent = "";

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      const {
        error
      } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        loginError.textContent = error.message;
        return;
      }

      const isAdmin = await checkAdmin();

      if (isAdmin) {
        await loadProducts();
      }
    });


    document.getElementById("logoutBtn")
      .addEventListener("click", async () => {

        await supabaseClient.auth.signOut();

        showLogin();
      });


    document.getElementById("newProductBtn")
      .addEventListener("click", openNewProduct);


    document.getElementById("cancelBtn")
      .addEventListener("click", () => {
        editor.classList.add("hidden");
        resetEditor();
      });


    document.getElementById("saveDraftBtn")
      .addEventListener("click", () => {
        saveProduct(true);
      });


    productForm.addEventListener("submit", event => {
      event.preventDefault();
      saveProduct(false);
    });


    document.getElementById("publishAllBtn")
      .addEventListener("click", publishAll);


    document.getElementById("unpublishAllBtn")
      .addEventListener("click", unpublishAll);


    frontFile.addEventListener("change", () => {

      const file = frontFile.files[0];

      if (!file) {
        return;
      }

      const url = URL.createObjectURL(file);

      frontPreview.innerHTML =
        `<img src="${url}" alt="Front preview">`;
    });


    backFile.addEventListener("change", () => {

      const file = backFile.files[0];

      if (!file) {
        return;
      }

      const url = URL.createObjectURL(file);

      backPreview.innerHTML =
        `<img src="${url}" alt="Back preview">`;
    });


    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {

        if (!session) {
          showLogin();
          return;
        }

        if (event === "SIGNED_IN") {
          const isAdmin = await checkAdmin();

          if (isAdmin) {
            await loadProducts();
          }

          return;
        }

        if (event === "INITIAL_SESSION") {
          const isAdmin = await checkAdmin();

          if (isAdmin) {
            await loadProducts();
          }
        }
      }
    );
  </script>

</body>
</html>
