<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost Saints — Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
    button,input,textarea,select{font:inherit}
    .hidden{display:none!important}
    #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .login-box{width:100%;max-width:420px;border:1px solid #292929;padding:32px;background:#0c0c0c}
    .logo{font-size:28px;font-weight:900;letter-spacing:3px;margin-bottom:8px}
    .subtitle{color:#888;margin-bottom:30px;font-size:14px}
    label{display:block;font-size:12px;color:#aaa;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
    input,textarea,select{width:100%;background:#111;color:#fff;border:1px solid #333;padding:13px;outline:none;margin-bottom:18px;border-radius:0}
    input:focus,textarea:focus,select:focus{border-color:#fff}
    textarea{min-height:110px;resize:vertical}
    button{border:0;cursor:pointer}
    .primary-btn{width:100%;background:#fff;color:#000;padding:14px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
    .primary-btn:hover{background:#ddd}
    .error{color:#ff5555;font-size:13px;margin-top:15px;line-height:1.5}
    .success{color:#62ff91;font-size:13px;margin-top:15px}
    #adminScreen{min-height:100vh}
    header{height:72px;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;background:rgba(5,5,5,.96);z-index:20}
    .admin-title{font-weight:900;letter-spacing:2px}
    .logout-btn{background:transparent;color:#fff;border:1px solid #444;padding:9px 15px;text-transform:uppercase;font-size:11px;letter-spacing:1px}
    main{max-width:1250px;margin:0 auto;padding:30px 20px 80px}
    .top-row{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px}
    h1{margin:0;font-size:28px}
    .new-btn{background:#fff;color:#000;padding:12px 18px;font-weight:800}
    .layout{display:grid;grid-template-columns:390px 1fr;gap:25px;align-items:start}
    .panel{border:1px solid #242424;background:#0b0b0b;padding:22px}
    .panel h2{font-size:16px;margin:0 0 22px;text-transform:uppercase;letter-spacing:1px}
    .image-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
    .image-box{border:1px solid #292929;padding:10px}
    .image-preview{width:100%;aspect-ratio:1;object-fit:cover;background:#151515;display:block;margin-bottom:8px}
    .upload-label{display:block;border:1px solid #333;padding:9px;text-align:center;font-size:11px;cursor:pointer}
    .upload-label:hover{border-color:#fff}
    .upload-label input{display:none}
    .stock-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .stock-item{display:grid;grid-template-columns:1fr 70px;gap:6px;align-items:center}
    .stock-item span{font-size:11px;color:#aaa}
    .stock-item input{margin:0;padding:9px}
    .checkbox-row{display:flex;align-items:center;gap:10px;margin:5px 0 20px}
    .checkbox-row input{width:auto;margin:0}
    .checkbox-row label{margin:0}
    .products-list{display:grid;gap:12px}
    .product-card{border:1px solid #242424;padding:15px;display:grid;grid-template-columns:90px 1fr auto;gap:15px;align-items:center;background:#0b0b0b}
    .product-card img{width:90px;height:90px;object-fit:cover;background:#151515}
    .product-name{font-weight:800;margin-bottom:7px}
    .product-info{color:#888;font-size:12px;line-height:1.7}
    .product-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .small-btn{background:#161616;border:1px solid #333;color:#fff;padding:9px 12px;font-size:11px}
    .small-btn:hover{border-color:#fff}
    .delete-btn:hover{border-color:#ff5555;color:#ff5555}
    .publish-btn{border-color:#62ff91;color:#62ff91}
    .unpublish-btn{border-color:#ffb347;color:#ffb347}
    .badge{display:inline-block;padding:4px 7px;font-size:9px;letter-spacing:1px;font-weight:800;margin-left:6px}
    .badge-draft{background:#222;color:#aaa}
    .badge-published{background:#12351e;color:#62ff91}
    .empty{border:1px dashed #333;padding:35px;text-align:center;color:#777}
    .loading{color:#888;padding:20px 0}
    @media(max-width:850px){
      .layout{grid-template-columns:1fr}
      .top-row{align-items:flex-start}
    }
    @media(max-width:600px){
      header{padding:0 15px}
      main{padding:20px 12px 60px}
      .panel{padding:15px}
      .product-card{grid-template-columns:65px 1fr}
      .product-card img{width:65px;height:65px}
      .product-actions{grid-column:1/-1}
      .product-actions button{flex:1}
    }
  </style>
</head>

<body>

<section id="loginScreen">
  <div class="login-box">
    <div class="logo">LOST SAINTS</div>
    <div class="subtitle">ADMIN PANEL</div>

    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required placeholder="admin@email.com">

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">

      <button class="primary-btn" type="submit">Login</button>
      <div id="loginError" class="error"></div>
    </form>
  </div>
</section>

<section id="adminScreen" class="hidden">

  <header>
    <div class="admin-title">LOST SAINTS / ADMIN</div>
    <button id="logoutBtn" class="logout-btn">Logout</button>
  </header>

  <main>

    <div class="top-row">
      <h1>Products</h1>
      <button id="newProductBtn" class="new-btn">+ New Product</button>
    </div>

    <div class="layout">

      <div class="panel">

        <h2 id="formTitle">New Product</h2>

        <form id="productForm">

          <label for="productName">Product name</label>
          <input id="productName" type="text" required>

          <label for="productPrice">Price (€)</label>
          <input id="productPrice" type="number" min="0" step="0.01" required>

          <label for="productCategory">Category</label>
          <select id="productCategory">
            <option value="tops">Tops</option>
            <option value="bottoms">Bottoms</option>
            <option value="accessories">Accessories</option>
            <option value="sets">Sets</option>
          </select>

          <label for="productDrop">Drop</label>
          <input id="productDrop" type="text" value="Available now">

          <label for="productDescription">Description</label>
          <textarea id="productDescription"></textarea>

          <div class="checkbox-row">
            <input id="productAvailable" type="checkbox" checked>
            <label for="productAvailable">Product available</label>
          </div>

          <div class="checkbox-row">
            <input id="productPublished" type="checkbox">
            <label for="productPublished">Publish product on store</label>
          </div>

          <div class="image-grid">

            <div class="image-box">
              <img id="frontPreview" class="image-preview" alt="Front preview">

              <label class="upload-label">
                Upload front
                <input id="frontImage" type="file" accept="image/*">
              </label>
            </div>

            <div class="image-box">
              <img id="backPreview" class="image-preview" alt="Back preview">

              <label class="upload-label">
                Upload back
                <input id="backImage" type="file" accept="image/*">
              </label>
            </div>

          </div>

          <label>Stock by size</label>

          <div class="stock-grid">

            <div class="stock-item">
              <span>XXS</span>
              <input data-size="XXSMALL" type="number" min="0" value="0">
            </div>

            <div class="stock-item">
              <span>XS</span>
              <input data-size="XSMALL" type="number" min="0" value="0">
            </div>

            <div class="stock-item">
              <span>S</span>
              <input data-size="SMALL" type="number" min="0" value="0">
            </div>

            <div class="stock-item">
              <span>M</span>
              <input data-size="MEDIUM" type="number" min="0" value="0">
            </div>

            <div class="stock-item">
              <span>L</span>
              <input data-size="LARGE" type="number" min="0" value="0">
            </div>

            <div class="stock-item">
              <span>XL</span>
              <input data-size="XLARGE" type="number" min="0" value="0">
            </div>

            <div class="stock-item">
              <span>XXL</span>
              <input data-size="XXLARGE" type="number" min="0" value="0">
            </div>

          </div>

          <br>

          <button class="primary-btn" type="submit">
            Save Product
          </button>

          <div id="formMessage"></div>

        </form>

      </div>

      <div class="panel">

        <h2>Current Products</h2>

        <div id="productsList" class="products-list">
          <div class="loading">Loading products...</div>
        </div>

      </div>

    </div>

  </main>
</section>

<script>

const SUPABASE_URL =
  "https://lvppsjgohaefczbmzdlm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_f9W3McCrxK98_AeydqIFiQ_L1WHR7UV";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let editingProductId = null;
let products = [];

const loginScreen =
  document.getElementById("loginScreen");

const adminScreen =
  document.getElementById("adminScreen");

const loginForm =
  document.getElementById("loginForm");

const loginError =
  document.getElementById("loginError");

const logoutBtn =
  document.getElementById("logoutBtn");

const productForm =
  document.getElementById("productForm");

const productsList =
  document.getElementById("productsList");

const formTitle =
  document.getElementById("formTitle");

const formMessage =
  document.getElementById("formMessage");

const newProductBtn =
  document.getElementById("newProductBtn");

const frontImage =
  document.getElementById("frontImage");

const backImage =
  document.getElementById("backImage");

const frontPreview =
  document.getElementById("frontPreview");

const backPreview =
  document.getElementById("backPreview");


function placeholderImage() {
  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="500" height="500">
        <rect width="500" height="500" fill="#151515"/>
        <text x="250" y="250" fill="#555" font-size="22"
          text-anchor="middle" dominant-baseline="middle">
          LOST SAINTS
        </text>
      </svg>
    `);
}


function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function escapeAttribute(value) {
  return escapeHtml(value);
}


function showLogin() {
  loginScreen.classList.remove("hidden");
  adminScreen.classList.add("hidden");
}


function showAdmin() {
  loginScreen.classList.add("hidden");
  adminScreen.classList.remove("hidden");
  loadProducts();
}


loginForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  loginError.textContent = "";

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    loginError.textContent = error.message;
    return;
  }

  if (!data.user) {
    loginError.textContent = "Login failed.";
    return;
  }

  const {
    data: adminRow,
    error: adminError
  } =
    await supabaseClient
      .from("admin_users")
      .select("user_id")
      .eq("user_id", data.user.id)
      .maybeSingle();

  if (adminError) {
    await supabaseClient.auth.signOut();
    loginError.textContent = adminError.message;
    return;
  }

  if (!adminRow) {
    await supabaseClient.auth.signOut();
    loginError.textContent = "This account is not an admin.";
    return;
  }

  showAdmin();

});


async function checkSession() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient.auth.getSession();

  if (!session) {
    showLogin();
    return;
  }

  const {
    data: adminRow,
    error
  } =
    await supabaseClient
      .from("admin_users")
      .select("user_id")
      .eq("user_id", session.user.id)
      .maybeSingle();

  if (error || !adminRow) {
    await supabaseClient.auth.signOut();
    showLogin();
    return;
  }

  showAdmin();
}


logoutBtn.addEventListener("click", async function() {
  await supabaseClient.auth.signOut();
  showLogin();
});


newProductBtn.addEventListener("click", resetForm);


function resetForm() {

  editingProductId = null;

  formTitle.textContent = "New Product";

  productForm.reset();

  document.getElementById("productDrop").value =
    "Available now";

  document.getElementById("productAvailable").checked =
    true;

  document.getElementById("productPublished").checked =
    false;

  document
    .querySelectorAll(".stock-item input")
    .forEach(input => {
      input.value = 0;
    });

  frontPreview.src = placeholderImage();
  backPreview.src = placeholderImage();

  frontImage.value = "";
  backImage.value = "";

  formMessage.textContent = "";
}


frontImage.addEventListener("change", function() {

  const file = frontImage.files[0];

  if (!file) return;

  frontPreview.src =
    URL.createObjectURL(file);

});


backImage.addEventListener("change", function() {

  const file = backImage.files[0];

  if (!file) return;

  backPreview.src =
    URL.createObjectURL(file);

});


async function loadProducts() {

  productsList.innerHTML =
    '<div class="loading">Loading products...</div>';

  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select("*")
      .order("created_at", {
        ascending: false
      });

  if (error) {
    productsList.innerHTML =
      `<div class="error">${escapeHtml(error.message)}</div>`;
    return;
  }

  products = data || [];

  renderProducts();
}


function renderProducts() {

  if (!products.length) {
    productsList.innerHTML =
      '<div class="empty">No products yet.</div>';
    return;
  }

  productsList.innerHTML =
    products.map(product => {

      const image =
        product.front ||
        product.back ||
        placeholderImage();

      const stock =
        product.stock || {};

      const stockTotal =
        Object.values(stock)
          .reduce(
            (sum,value) =>
              sum + Number(value || 0),
            0
          );

      const published =
        product.published === true;

      return `
        <div class="product-card">

          <img
            src="${escapeAttribute(image)}"
            alt="${escapeAttribute(product.name)}"
          >

          <div>

            <div class="product-name">
              ${escapeHtml(product.name)}

              ${
                published
                  ? '<span class="badge badge-published">PUBLISHED</span>'
                  : '<span class="badge badge-draft">DRAFT</span>'
              }

            </div>

            <div class="product-info">
              €${Number(product.price || 0).toFixed(2)}
              · ${escapeHtml(product.category || "")}
              · ${product.available ? "AVAILABLE" : "SOLD OUT"}
              <br>
              Stock: ${stockTotal}
            </div>

          </div>

          <div class="product-actions">

            <button
              class="small-btn"
              onclick="editProduct(${product.id})">
              Edit
            </button>

            <button
              class="small-btn ${
                published
                  ? "unpublish-btn"
                  : "publish-btn"
              }"
              onclick="togglePublish(${product.id})">

              ${
                published
                  ? "Unpublish"
                  : "Publish"
              }

            </button>

            <button
              class="small-btn delete-btn"
              onclick="deleteProduct(${product.id})">
              Delete
            </button>

          </div>

        </div>
      `;

    }).join("");

}


window.editProduct = function(id) {

  const product =
    products.find(
      item => Number(item.id) === Number(id)
    );

  if (!product) return;

  editingProductId = product.id;

  formTitle.textContent = "Edit Product";

  document.getElementById("productName").value =
    product.name || "";

  document.getElementById("productPrice").value =
    product.price || 0;

  document.getElementById("productCategory").value =
    product.category || "tops";

  document.getElementById("productDrop").value =
    product.drop || "Available now";

  document.getElementById("productDescription").value =
    product.description || "";

  document.getElementById("productAvailable").checked =
    product.available !== false;

  document.getElementById("productPublished").checked =
    product.published === true;

  setStockForm(product.stock || {});

  frontPreview.src =
    product.front || placeholderImage();

  backPreview.src =
    product.back || placeholderImage();

  frontImage.value = "";
  backImage.value = "";

  formMessage.textContent = "";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


function getStockFromForm() {

  const stock = {};

  document
    .querySelectorAll(".stock-item input")
    .forEach(input => {

      stock[input.dataset.size] =
        Math.max(
          0,
          Number(input.value || 0)
        );

    });

  return stock;
}


function setStockForm(stock) {

  document
    .querySelectorAll(".stock-item input")
    .forEach(input => {

      input.value =
        Number(
          stock[input.dataset.size] || 0
        );

    });

}


async function uploadImage(file) {

  if (!file) return null;

  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();

  const fileName =
    `${crypto.randomUUID()}.${extension}`;

  const filePath =
    `products/${fileName}`;

  const {
    error
  } =
    await supabaseClient
      .storage
      .from("product-images")
      .upload(
        filePath,
        file,
        {
          upsert:false,
          contentType:file.type
        }
      );

  if (error) throw error;

  const {
    data
  } =
    supabaseClient
      .storage
      .from("product-images")
      .getPublicUrl(filePath);

  return data.publicUrl;
}


productForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    formMessage.className = "";
    formMessage.textContent = "Saving...";

    try {

      const name =
        document.getElementById("productName").value.trim();

      const price =
        Number(
          document.getElementById("productPrice").value
        );

      const category =
        document.getElementById("productCategory").value;

      const drop =
        document.getElementById("productDrop").value.trim();

      const description =
        document.getElementById("productDescription").value.trim();

      const available =
        document.getElementById("productAvailable").checked;

      const published =
        document.getElementById("productPublished").checked;

      const stock =
        getStockFromForm();

      let frontUrl = null;
      let backUrl = null;

      if (frontImage.files[0]) {
        frontUrl =
          await uploadImage(frontImage.files[0]);
      }

      if (backImage.files[0]) {
        backUrl =
          await uploadImage(backImage.files[0]);
      }

      if (editingProductId) {

        const existing =
          products.find(
            product =>
              Number(product.id) ===
              Number(editingProductId)
          );

        const updateData = {
          name,
          price,
          category,
          drop,
          description,
          available,
          published,
          stock,
          sizes:Object.keys(stock)
        };

        updateData.front =
          frontUrl ||
          existing?.front ||
          null;

        updateData.back =
          backUrl ||
          existing?.back ||
          null;

        const {
          error
        } =
          await supabaseClient
            .from("products")
            .update(updateData)
            .eq("id", editingProductId);

        if (error) throw error;

        formMessage.className = "success";
        formMessage.textContent =
          published
            ? "Product published successfully."
            : "Product saved as draft.";

      } else {

        const {
          error
        } =
          await supabaseClient
            .from("products")
            .insert({
              name,
              price,
              category,
              drop,
              description,
              available,
              published,
              stock,
              sizes:Object.keys(stock),
              front:frontUrl,
              back:backUrl
            });

        if (error) throw error;

        formMessage.className = "success";
        formMessage.textContent =
          published
            ? "Product published successfully."
            : "Product saved as draft.";
      }

      await loadProducts();

      if (!editingProductId) {
        setTimeout(() => {
          resetForm();
        }, 700);
      }

    } catch(error) {

      console.error(error);

      formMessage.className = "error";
      formMessage.textContent =
        error.message ||
        "Something went wrong.";

    }

  }
);


window.togglePublish = async function(id) {

  const product =
    products.find(
      item =>
        Number(item.id) === Number(id)
    );

  if (!product) return;

  const newStatus =
    product.published !== true;

  const {
    error
  } =
    await supabaseClient
      .from("products")
      .update({
        published:newStatus
      })
      .eq("id",id);

  if (error) {
    alert(error.message);
    return;
  }

  await loadProducts();
};


window.deleteProduct = async function(id) {

  const product =
    products.find(
      item =>
        Number(item.id) === Number(id)
    );

  if (!product) return;

  const confirmed =
    confirm(
      `Delete "${product.name}"?`
    );

  if (!confirmed) return;

  const {
    error
  } =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id",id);

  if (error) {
    alert(error.message);
    return;
  }

  if (
    editingProductId &&
    Number(editingProductId) === Number(id)
  ) {
    resetForm();
  }

  await loadProducts();
};


frontPreview.src = placeholderImage();
backPreview.src = placeholderImage();

checkSession();

</script>

</body>
</html>
